# Tell every workspace this repo moved. Nothing is built here.
#
# A lone checkout of this repo has no sibling repos, no workspace go.work or
# root Cargo.toml, and no go.mod, because the manifests are generated and
# gitignored. Building here is not possible and a workflow that tries is red
# forever. The pipelines build, in their workspaces, from synced checkouts.
#
# This repo is a member of more than one workspace, and telling only one of
# them is the bug this file used to carry: the toolchain's own pipeline never
# heard that its own members had moved.

name: notify

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    strategy:
      # One workspace refusing the dispatch must not stop the others.
      fail-fast: false
      matrix:
        workspace:
          - forge-self-factory
    steps:
      - name: Tell ${{ matrix.workspace }} to run its pipeline
        env:
          GH_TOKEN: ${{ secrets.WORKSPACE_DISPATCH_TOKEN }}
        run: |
          gh api repos/alexandremahdhaoui/${{ matrix.workspace }}/dispatches \
            --field event_type=member-pushed \
            --field 'client_payload[repo]=${{ github.repository }}' \
            --field 'client_payload[sha]=${{ github.sha }}'
