# Tell forge-self-factory that forge moved. Nothing is built here.
#
# Generated by forge-ci from spec.watch. Edit the pipeline, not this file:
# every apply converges it back.
#
# A lone checkout of this repo has no siblings and no workspace files,
# because they are generated and gitignored. Building here is not possible
# and a workflow that tries is red forever.

name: notify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Tell forge-self-factory to run the pipeline
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.FORGE_CI_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/alexandremahdhaoui/forge-self-factory/dispatches" \
            -d '{"event_type":"member-pushed","client_payload":{"repo":"${{ github.repository }}","sha":"${{ github.sha }}"}}'
