openapi: 3.0.3
info:
  title: container-build Spec Schema
  version: 0.15.0
  description: >
    Schema for the container-build engine spec.
    The container-build engine builds container images using Docker, Podman, or Kaniko.

    NOT IMPLEMENTED, and each fails silently rather than loudly: push,
    registry and tags are parsed and never read (build.go opens with
    `_ = spec // TODO`, and kaniko hardcodes --no-push), and there is no
    --platform anywhere, so the build is the host architecture only.

    For an image that is a base plus a directory of prebuilt files, use
    container-build-simple: it needs no daemon and no Containerfile, and
    multi-architecture costs nothing there. Everything this engine carries
    exists to support RUN steps.
components:
  schemas:
    Spec:
      type: object
      description: Configuration for container-build engine
      properties:
        dockerfile:
          type: string
          description: Path to Dockerfile (optional)
        context:
          type: string
          description: Build context path (optional)
        buildArgs:
          type: object
          additionalProperties:
            type: string
          description: Build arguments (optional)
        tags:
          type: array
          items:
            type: string
          description: "NOT IMPLEMENTED: parsed and never read. Image tags (optional)"
        target:
          type: string
          description: Build target stage (optional)
        push:
          type: boolean
          description: "NOT IMPLEMENTED: parsed and never read, and no mode runs a push. Whether to push image (optional)"
        registry:
          type: string
          description: "NOT IMPLEMENTED: parsed and never read. Registry URL (optional)"
